name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Este nombre es el "status check" que exigen los rulesets de main y develop.
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0
      # Valores ficticios: el build no llama a Supabase, pero el código los lee al cargar.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:run
      - run: npm run build

  base-de-datos:
    # Job aparte y en paralelo: no alarga el CI de la aplicación. Aplica TODAS las
    # migraciones y el seed desde cero (si una falla, falla aquí) y corre las
    # pruebas pgTAP de supabase/tests.
    name: Base de datos
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          # La misma versión que fija package.json ("supabase").
          version: 2.116.0
      - name: Levantar Supabase local
        # Sin los servicios que las pruebas no usan: Studio, imgproxy, funciones
        # edge, logs, correo y pooler. Quedan Postgres, Auth y Storage, que
        # crean los esquemas auth y storage de los que dependen las migraciones.
        run: supabase start -x studio,imgproxy,edge-runtime,vector,logflare,mailpit,postgres-meta,supavisor
      - name: Aplicar migraciones y seed desde cero
        run: supabase db reset
      - name: Pruebas pgTAP
        run: supabase test db

  e2e:
    # Job aparte y en paralelo. Levanta Supabase local con el seed y la
    # aplicación compilada, y un navegador real hace los flujos de e2e/flujos.
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          # La misma versión que fija package.json ("supabase").
          version: 2.121.0
      - name: Levantar Supabase local con el seed
        run: |
          supabase start -x studio,imgproxy,edge-runtime,vector,logflare,mailpit,postgres-meta,supavisor
          supabase db reset
      - name: Variables de la aplicación apuntando a Supabase local
        # `.env.local` no existe en CI: se arma con las llaves de esta base.
        run: |
          eval "$(supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=')"
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
          } > .env.local
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Guardar el reporte si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-e2e
          path: |
            playwright-report
            test-results
          retention-days: 7
